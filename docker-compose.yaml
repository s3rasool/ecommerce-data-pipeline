services:
  mongodb:
    image: ${REGISTRY}/mongo:7.0.14
    hostname: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb
    networks:
      - mongo_network

volumes:
  mongo_data:
  mongo_configdb:

networks:
  mongo_network:
